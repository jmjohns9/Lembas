name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The full suite, with the optional PDF and Office libraries and poppler installed.
  full:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit; the comment names the release it points to.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pip install -q -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Skill files have name and description
        run: |
          for s in lembas ithildin; do
            head -1 skills/$s/SKILL.md | grep -qx -- '---'
            grep -q "^name: $s$" skills/$s/SKILL.md
            grep -q '^description:' skills/$s/SKILL.md
          done

      - name: Reply length
        run: python3 scripts/count_tokens.py evals/results/v2.0.0

      - name: Facts kept and answer structure
        run: python3 scripts/grade.py evals/evals.json evals/results/v2.0.0

      - name: Package builds
        run: |
          bash scripts/package.sh
          unzip -l dist/lembas.skill | grep -q 'lembas/SKILL.md'
          unzip -l dist/ithildin.skill | grep -q 'ithildin/scripts/ithildin.py'
          (cd dist && sha256sum -c SHA256SUMS)

  # The skills need only the standard library. Run the suite with nothing installed, on the oldest
  # available Python and a recent one, so a newer-only feature or a hidden dependency shows up here.
  stdlib:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one version failing should not cancel the others
      matrix:
        # 3.10 is the oldest version setup-python offers on ubuntu-latest (Ubuntu 26.04).
        # 3.8 and 3.9 are checked locally; the runners no longer provide them.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Tests (optional libraries absent; their tests are skipped)
        run: python -m unittest discover -s tests
