name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skill files have name and description
        run: |
          for s in lembas ithildin; do
            head -1 skills/$s/SKILL.md | grep -qx -- '---'
            grep -q "^name: $s$" skills/$s/SKILL.md
            grep -q '^description:' skills/$s/SKILL.md
          done

      - name: Reply length
        run: python3 scripts/count_tokens.py evals/results/v2.0.0

      - name: Facts kept and answer structure
        run: python3 scripts/grade.py evals/evals.json evals/results/v2.0.0

      - name: Squeeze compressor and hook
        run: python3 tests/test_squeeze.py

      - name: Ithildin document reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pip install -q pypdf pdfplumber reportlab python-docx python-pptx
          python3 tests/test_ithildin.py

      - name: Package builds
        run: |
          bash scripts/package.sh
          unzip -l dist/lembas.skill | grep -q 'lembas/SKILL.md'
          unzip -l dist/ithildin.skill | grep -q 'ithildin/scripts/ithildin.py'
